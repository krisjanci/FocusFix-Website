<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FocusFix for macOS. Make time for a break. Break reminders for your workday. Currently in development.">
  <meta name="color-scheme" content="light">
  <title>FocusFix — Make time for a break</title>
  <link rel="icon" href="assets/focusfix.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script src="motion.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="FocusFix home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.3"/><path d="M9 8v8m6-8v8" stroke="currentColor" stroke-width="2.2"/></svg>FocusFix</a>
      <div class="header-tools"><a href="privacy.html">Recording &amp; privacy</a><button class="motion-toggle" type="button" aria-pressed="false" hidden><span class="toggle-symbol" aria-hidden="true">Ⅱ</span><span data-toggle-label>Pause motion</span></button></div>
    </header>
    <main>
      <section class="hero" aria-labelledby="app-title">
        <div class="hero-copy">
          <p class="eyebrow">For macOS</p>
          <h1 id="app-title">Make time<br>for a <em>break.</em></h1>
          <p class="slogan">Break reminders for your workday.</p>
          <!-- No app download until the exact release is signed, notarized and tested. -->
          <button class="download" type="button" disabled aria-describedby="download-note">Download coming soon <span aria-hidden="true">↗</span></button>
          <p id="download-note">In development</p>
        </div>
        <figure class="sculpture" data-phase="pause" aria-labelledby="sculpture-description">
          <div class="sculpture-visual">
          <canvas class="thread-canvas" width="720" height="720" aria-hidden="true"></canvas>
          <svg class="thread-fallback" viewBox="0 0 600 600" fill="none" aria-hidden="true"><defs><pattern id="threads" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 0v5" stroke="#3b6458" stroke-width=".7"/></pattern></defs><path d="M245 130C185 180 185 420 245 470C290 410 290 190 245 130ZM355 130C310 190 310 410 355 470C415 420 415 180 355 130Z" fill="url(#threads)"/></svg>
          </div>
          <figcaption class="art-caption">
            <span id="sculpture-description" class="sr-only">Focus: stay with your work. Pause: step away from the screen. Continue: return to your work. A continuous thread gathers into a dense loop, separates into a pause, then opens into an ordered circle.</span>
            <div class="phase-words" aria-hidden="true"><span class="phase-word" data-word="focus">Focus.</span><span class="phase-word" data-word="pause"><em>Pause.</em></span><span class="phase-word" data-word="continue">Continue.</span></div>
            <div class="phase-descriptions" aria-hidden="true"><span data-description="focus">Stay with your work.</span><span data-description="pause">Step away from the screen.</span><span data-description="continue">Return to your work.</span></div>
            <span class="phase-rule" aria-hidden="true"><span></span></span>
          </figcaption>
        </figure>
      </section>
      <div class="pause-divider" aria-hidden="true"><span></span><i></i><i></i><span></span></div>
      <section class="resources" aria-label="Getting started resources">
        <div class="resource"><span class="resource-number">01</span><h2>Getting started</h2><p>Video tutorial coming soon</p><svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="m9 5 10 7-10 7V5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
        <div class="resource"><span class="resource-number">02</span><h2>Written guide</h2><p>Documentation coming soon</p><svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M4 4h7c2 0 3 1 3 3v14c0-2-1-3-3-3H4V4Zm10 3c0-2 1-3 3-3h3v14h-3c-2 0-3 1-3 3" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
      </section>
    </main>
    <footer class="site-footer"><span>FocusFix <span class="footer-platform">/ macOS</span></span><a href="privacy.html">Recording &amp; privacy <span aria-hidden="true">↗</span></a></footer>
  </div>
</body>
</html>
