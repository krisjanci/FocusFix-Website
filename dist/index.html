<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FocusFix for macOS. Make time for a break. A local-first activity tool, currently in development.">
  <meta name="color-scheme" content="light">
  <title>FocusFix — Make time for a break</title>
  <link rel="icon" href="assets/focusfix.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="app-title">
      <img class="app-logo" src="assets/focusfix.png" width="112" height="112" alt="FocusFix app icon">
      <h1 id="app-title">FocusFix</h1>
      <p class="slogan">Make time for a break.</p>
      <!-- No app download until the exact release is signed, notarized and tested. -->
      <button class="download" type="button" disabled aria-describedby="download-note">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download coming soon
      </button>
      <p id="download-note">In development · not available for download yet</p>
      <a class="privacy-link" href="privacy.html">Recording &amp; privacy</a>
    </section>

    <section class="tutorial" aria-labelledby="tutorial-title">
      <div class="section-heading">
        <h2 id="tutorial-title">Getting started</h2>
        <span>Video tutorial</span>
      </div>
      <!-- Replace this non-interactive placeholder with the tutorial video later. -->
      <div class="video-placeholder">
        <span class="play-icon" aria-hidden="true">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="m9 5 10 7-10 7V5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </span>
        <p>Tutorial video coming soon</p>
      </div>
    </section>

    <section class="manual" aria-labelledby="manual-title">
      <div class="section-heading">
        <h2 id="manual-title">Written guide</h2>
        <span>Coming later</span>
      </div>
      <!-- Reserved space for the manual. Add content once the app is ready. -->
      <div class="manual-space" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
